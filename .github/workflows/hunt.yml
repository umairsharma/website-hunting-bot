name: Website Hunting Bot

on:
  schedule:
    # Every day at 04:17 UTC = 9:17 AM Pakistan time. GitHub schedules use UTC.
    - cron: "17 4 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # lets the bot save data/ (leads.csv, seen.json) back to the repo

concurrency:
  group: website-hunting-bot
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install packages
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Hunt for leads
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "website-hunting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Update leads data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
