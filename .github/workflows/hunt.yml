name: Website Hunting Bot

on:
  schedule:
    # Every day at 4:00 PM Pakistan time. GitHub schedules use UTC; Pakistan is always UTC+5 (no daylight saving).
    - cron: "0 11 * * *"
  # The "Run workflow" button in the Actions tab (also in the GitHub mobile app).
  # Leave the boxes empty to use config.js. Anything typed here applies to that one run only.
  workflow_dispatch:
    inputs:
      city:
        description: "City (optional, e.g. Manchester). Empty = city from config.js"
        required: false
        default: ""
      country:
        description: "Country (optional, e.g. United Kingdom). Fill this in with a new city"
        required: false
        default: ""
      niche:
        description: "Type of business from the list (optional)"
        type: choice
        required: false
        default: "(daily settings)"
        options:
          - "(daily settings)"
          - restaurant
          - cafe
          - fast_food
          - bakery
          - salon
          - dentist
          - clinic
          - pharmacy
          - gym
          - car_repair
          - car_dealer
          - motorcycle
          - clothes
          - shoes
          - jewelry
          - electronics
          - furniture
          - hardware
          - grocery
          - butcher
          - optician
          - florist
          - hotel
          - real_estate
          - lawyer
          - accountant
          - travel_agency
          - vet
          - laundry
          - printing
          - photographer
          - pet_shop
          - books
          - driving_school
          - plumber
          - electrician
          - hvac
          - roofer
          - painter
          - locksmith
          - carpenter
          - cleaning
          - landscaping
      custom_niche:
        description: "Or type ANY business type, e.g. pool cleaners (optional, found by searching Google Maps)"
        required: false
        default: ""

permissions:
  contents: write # lets the bot save data/ (leads.csv, seen.json) back to the repo

concurrency:
  group: website-hunting-bot
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v5
        with:
          # The latest commit when this job starts, not when the run was queued. Otherwise a run queued
          # behind another starts from old data/ and re-checks (and re-sends) the same businesses.
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        # Exact versions from package-lock.json, so a new Playwright release can't break the bot overnight.
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Hunt for leads
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }} # optional, see README
          # From the Run workflow form; empty on the daily run.
          HUNT_CITY: ${{ inputs.city }}
          HUNT_COUNTRY: ${{ inputs.country }}
          HUNT_NICHE: ${{ inputs.niche }}
          HUNT_CUSTOM_NICHE: ${{ inputs.custom_niche }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "website-hunting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Update leads data"
          # If this push is lost, the next run re-checks the same businesses and sends duplicate leads,
          # so retry. leads.csv merges by keeping both sides' rows (.gitattributes); on any other clash
          # in data/, this run's copy wins (-X theirs keeps the commit being replayed).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Save attempt $attempt failed, retrying…"
            sleep $((attempt * 10))
          done
          echo "::error::Couldn't save data/ back to the repo. The next run may send some leads again."
          exit 1
