name: Website Hunting Bot

on:
  schedule:
    # Every day at 9:00 AM UK time. GitHub schedules only use UTC, and UK clocks change,
    # so both times are listed and the "time-check" job below lets through only the one that is 9 AM in London:
    - cron: "0 8 * * *" # 9 AM in summer (BST, UTC+1)
    - cron: "0 9 * * *" # 9 AM in winter (GMT, UTC+0)
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # lets the bot save data/ (leads.csv, seen.json) back to the repo

concurrency:
  group: website-hunting-bot
  cancel-in-progress: false

jobs:
  time-check:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Manual runs always go. A scheduled run goes only if its UTC slot is 9 AM in London today
          # (based on which schedule fired, so a run GitHub starts late still counts).
          offset=$(TZ=Europe/London date +%z)
          if [ "${{ github.event_name }}" != "schedule" ] \
            || { [ "$SCHEDULE" = "0 8 * * *" ] && [ "$offset" = "+0100" ]; } \
            || { [ "$SCHEDULE" = "0 9 * * *" ] && [ "$offset" = "+0000" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 9 AM in the UK for this slot (London is UTC$offset), skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  hunt:
    needs: time-check
    if: needs.time-check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        # Exact versions from package-lock.json, so a new Playwright release can't break the bot overnight.
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Hunt for leads
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "website-hunting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Update leads data"
          # If this push is lost, the next run re-checks the same businesses and sends duplicate leads,
          # so retry. On a clash in data/, this run's copy wins (-X theirs keeps the commit being replayed).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Save attempt $attempt failed, retrying…"
            sleep $((attempt * 10))
          done
          echo "::error::Couldn't save data/ back to the repo. The next run may send some leads again."
          exit 1
